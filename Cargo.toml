[package]
name = "Mozannab"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.28"
egui = "0.28"
global-hotkey = "0.6"
nokhwa = { version = "0.10.10", features = ["input-native"] }
image = "0.24"
opencv = {version = "0.92.0", default-features = false, features = ["clang-runtime", "gapi", "imgcodecs", "imgproc", "videoio", "video", "highgui", "dnn"]}
once_cell = "1.21.3"
rust-embed = "8.0"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
simplelog = "0.12"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.bundle]
name = "Mozannab"
identifier = "com.company.mozannab"
icon = ["assets/icon.png"]
resources = ["assets"] 